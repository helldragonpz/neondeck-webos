name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/core.cjs
      - run: node tests/setup.cjs
      - run: python3 -m unittest discover -s tests -p 'installer.py'
      - run: python3 -m unittest discover -s tests -p 'release.py'
      - run: python3 build.py
      - run: python3 tools/audit_public.py
      - run: node tools/preview.mjs --test
