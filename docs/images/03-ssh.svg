 <text x="190" y="223" fill="#a1e8ff" font-size="21">Your computer → your TV</text><text x="190" y="270" fill="#c7b0ff" font-size="26">Dedicated SSH key</text><text x="190" y="328" fill="#edf3ff" font-size="26">TV_HOST stays on your computer</text><text x="190" y="386" fill="#edf3ff" font-size="26">Public key goes to the TV</text><text x="190" y="444" fill="#edf3ff" font-size="26">Private key stays with you</text>
